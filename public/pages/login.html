<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="N Eyes - Login de Acesso ao Sistema de Monitoramento de Rede">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
  <link rel="stylesheet" href="/css/notifications.css">
  <title>N Eyes | Login</title>

</head>

<body>
  <main class="login-shell" aria-label="Página de login N Eyes">
    <section class="brand">
      <h1>N Eyes</h1>
      <p>Acesso ao Sistema</p>
    </section>

    <form class="login-form" id="loginForm" aria-label="Formulário de login" novalidate>
      <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Ex: joao@test.com" required autocomplete="email">
      </div>
      <div>
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Ex: password123" required
          autocomplete="current-password">
      </div>
      <div id="loginError" class="login-error" role="alert" style="display:none;"></div>
      <button type="submit" id="loginBtn">Entrar</button>
    </form>

    <p class="login-help">
      Não tem conta? <a href="register.html">Cadastre-se</a> para acessar o painel.
    </p>

    <p class="login-footer">Painel de monitoramento de rede N Eyes</p>
  </main>

  <!-- Scripts necessários -->
  <script src="/js/config.js"></script>
  <script src="/js/services/api.service.js"></script>
  <script src="/js/services/auth.service.js"></script>

  <script>
    /**
     * Handler do formulário de login
     * ✅ Usa apiCall() + auth.service.js para chamar API real
     */
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Validação básica
      if (!email || !password) {
        showErrorNotification('Por favor, preencha todos os campos.', 'error');
        return;
      }

      // Desabilitar botão e mostrar loading
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      errorEl.style.display = 'none';

      try {
        // ✅ Chamar auth.service.js que usa apiCall()
        // apiCall() adiciona Authorization: Bearer <token> automaticamente
        const result = await login(email, password);

        // ✅ Token e usuário já foram salvos por auth.service.js
        // ✅ Redirecionar para dashboard
        window.location.href = 'home.html';

      } catch (error) {
        // ✅ showErrorNotification() já foi chamada por apiCall() se necessário
        console.error('[Login Error]', error);

        // Mostrar mensagem de erro mais específica
        if (error.message.includes('Credenciais inválidas')) {
          showErrorNotification('Email ou senha incorretos.', 'error');
        } else if (error.message.includes('Não autorizado')) {
          showErrorNotification('Erro de autenticação. Tente novamente.', 'error');
        } else {
          showErrorNotification(error.message || 'Erro ao fazer login. Tente novamente.', 'error');
        }

        // Restaurar botão
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>

</html>
