<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="N Eyes - Cadastro de Conta">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css">
  <title>N Eyes - Cadastro</title>
  <link rel="icon" href="/favicon-32x32.png" type="image/png">
</head>
<body>
  <!-- Carregar scripts de configuração primeiro -->
  <script src="/js/config.js"></script>
  <script src="/js/utils/helpers.js"></script>
  <script src="/js/utils/validators.js"></script>
  <script src="/js/services/api.service.js"></script>
  <script src="/js/services/auth.service.js"></script>
  <script src="/js/guards/authGuard.js"></script>

  <main class="login-shell" aria-label="Página de cadastro N Eyes">
    <section class="brand">
      <h1>N Eyes</h1>
      <p>Crie sua conta</p>
    </section>

    <form class="login-form" id="registerForm" aria-label="Formulário de cadastro" novalidate>
      <div class="mb-3">
        <label for="fullname" class="form-label">Nome completo</label>
        <input 
          type="text" 
          class="form-control" 
          id="fullname" 
          name="name" 
          placeholder="Digite seu nome" 
          required 
          autocomplete="name">
        <div class="invalid-feedback"></div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input 
          type="email" 
          class="form-control" 
          id="email" 
          name="email" 
          placeholder="Digite seu e-mail" 
          required 
          autocomplete="email">
        <div class="invalid-feedback"></div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <input 
          type="password" 
          class="form-control" 
          id="password" 
          name="password" 
          placeholder="Crie uma senha (mín. 6 caracteres)" 
          required 
          minlength="6"
          autocomplete="new-password">
        <small class="form-text text-muted">Mínimo 6 caracteres</small>
        <div class="invalid-feedback"></div>
      </div>
      <div class="mb-3">
        <label for="passwordConfirm" class="form-label">Confirme a Senha</label>
        <input 
          type="password" 
          class="form-control" 
          id="passwordConfirm" 
          name="passwordConfirm" 
          placeholder="Confirme sua senha" 
          required 
          autocomplete="new-password">
        <div class="invalid-feedback"></div>
      </div>
      <div id="registerError" class="alert alert-danger" role="alert" style="display:none;"></div>
      <div id="registerSuccess" class="alert alert-success" role="status" style="display:none;"></div>
      <button type="submit" id="registerBtn" class="btn btn-primary w-100">Cadastrar</button>

      <p class="login-help mt-3">
        Já tem conta? <a href="login.html">Faça login</a> para acessar o painel.
      </p>
    </form>

    <p class="login-footer">Painel de monitoramento de rede N Eyes</p>
  </main>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;

      const btn = document.getElementById('registerBtn');
      const errorEl = document.getElementById('registerError');
      const successEl = document.getElementById('registerSuccess');

      // Validar formulário
      const validation = validateRegisterForm({ name, email, password, passwordConfirm });
      if (!validation.valid) {
        displayFormErrors('registerForm', validation.errors);
        errorEl.style.display = 'none';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Cadastrando...';
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      try {
        await register(name, email, password);

        successEl.textContent = 'Conta criada com sucesso! Redirecionando para o login...';
        successEl.style.display = 'block';
        errorEl.style.display = 'none';

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);

      } catch (error) {
        clearFormErrors('registerForm');
        errorEl.textContent = error.message || 'Erro ao cadastrar. Tente novamente.';
        errorEl.style.display = 'block';
        successEl.style.display = 'none';
        btn.disabled = false;
        btn.textContent = 'Cadastrar';
      }
    });

    // Verificar se já está logado
    if (authGuard.isAuthenticated()) {
      window.location.href = '/pages/home.html';
    }
  </script>
</body>
</html>
